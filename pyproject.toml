[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-twin"
version = "0.1.0"
description = "Steady-state thermal digital twin using the HEATWISE experimental dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
thermal-twin = "thermal_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
